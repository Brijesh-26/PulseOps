server {
  listen 80;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  # Production CSP (the API is served same-origin behind the reverse proxy). Not applied to
  # the Vite dev server, whose HMR preamble requires an inline script.
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'" always;
  location / { try_files $uri /index.html; }
}
